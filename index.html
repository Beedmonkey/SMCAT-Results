<script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Generates a deterministic applicant ID based on username
        function generateApplicantId(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            const code = Math.abs(hash % 9000) + 1000;
            return `2026-SMC-${code}`;
        }

        async function verifyResult() {
            const inputVal = document.getElementById('usernameInput').value.trim().toLowerCase();
            const emptyState = document.getElementById('emptyState');
            const resultSlip = document.getElementById('resultSlip');
            
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusDesc = document.getElementById('statusDesc');

            // Reset to default state if search input is empty
            if (!inputVal) {
                emptyState.style.display = 'flex';
                resultSlip.style.display = 'none';
                statusIcon.innerText = '🎖️';
                statusIcon.style.color = 'var(--accent-gold)';
                statusTitle.innerText = 'No Examinee Selected';
                statusTitle.style.color = '#ffffff';
                statusDesc.innerText = 'Enter your registered username in the search box to check your official examination score and admission status.';
                return;
            }

            try {
                const response = await fetch('./results.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error("results.json file missing or unreadable");
                
                const data = await response.json();
                const userResult = data.find(item => item.username && item.username.trim().toLowerCase() === inputVal);

                if (userResult) {
                    // USER FOUND
                    emptyState.style.display = 'none';
                    resultSlip.style.display = 'flex';

                    document.getElementById('examineeUser').innerText = userResult.username;
                    document.getElementById('scoreDisplay').innerText = userResult.score;
                    document.getElementById('applicantNo').innerText = userResult.applicant_id || generateApplicantId(userResult.username);

                    if (userResult.date) {
                        document.getElementById('dateIssued').innerText = userResult.date.split(' ')[0];
                    }

                    const statusText = userResult.status ? userResult.status.toUpperCase() : (Number(userResult.score) >= 80 ? 'PASSED' : 'FAILED');
                    const statusBadge = document.getElementById('statusBadge');
                    statusBadge.innerText = statusText;

                    if (statusText === 'PASSED') {
                        statusBadge.style.backgroundColor = 'rgba(34, 197, 94, 0.2)';
                        statusBadge.style.color = '#4ade80';
                        statusBadge.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                    } else {
                        statusBadge.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                        statusBadge.style.color = '#f87171';
                        statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.4)';
                    }
                } else {
                    // USER NOT FOUND (Walang browser alert, direkta sa card display)
                    resultSlip.style.display = 'none';
                    emptyState.style.display = 'flex';
                    
                    statusIcon.innerText = '❌';
                    statusIcon.style.color = 'var(--fail-color)';
                    statusTitle.innerText = 'User Not Found';
                    statusTitle.style.color = '#f87171';
                    statusDesc.innerHTML = `No examination record found for <strong style="color:#fff;">"${inputVal}"</strong>. Please verify spelling or contact Office of Admissions.`;
                }
            } catch (err) {
                console.error('Error fetching results:', err);
                resultSlip.style.display = 'none';
                emptyState.style.display = 'flex';
                statusIcon.innerText = '⚠️';
                statusIcon.style.color = '#f59e0b';
                statusTitle.innerText = 'Error Loading Records';
                statusTitle.style.color = '#f59e0b';
                statusDesc.innerText = 'Could not retrieve database results. Please verify that results.json exists in your directory.';
            }
        }
    </script>
