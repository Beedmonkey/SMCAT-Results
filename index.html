<!-- JAVASCRIPT LOGIC -->
    <script>
        // Authorized Staff Usernames Only
        const authorizedStaff = [
            "admin",
            "staff_lsi",
            "instructor_smc",
            "officer_cadet"
        ];

        // Database ng Examinees
        const examineeDatabase = [
            { id: "2026-SMC-5398", username: "shailishmae", score: 92, status: "PASSED", date: "Sep 14, 2026" },
            { id: "2026-SMC-5399", username: "alex_cadet", score: 85, status: "PASSED", date: "Sep 14, 2026" },
            { id: "2026-SMC-5400", username: "johndoe", score: 68, status: "FAILED", date: "Sep 14, 2026" }
        ];

        // Tab Switcher Logic
        function switchTab(tabId, element) {
            const contents = document.querySelectorAll('.tab-content');
            const tabs = document.querySelectorAll('.tab-btn');

            contents.forEach(content => content.classList.remove('active'));
            tabs.forEach(tab => tab.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Verify Examinee Result Logic
        function verifyResult() {
            const inputVal = document.getElementById('usernameInput').value.trim().toLowerCase();
            const emptyState = document.getElementById('emptyState');
            const resultSlip = document.getElementById('resultSlip');

            if (!inputVal) {
                alert("Pakilagay ang iyong Username.");
                return;
            }

            const foundUser = examineeDatabase.find(user => user.username.toLowerCase() === inputVal || user.id.toLowerCase() === inputVal);

            if (foundUser) {
                emptyState.style.display = 'none';
                resultSlip.style.display = 'flex';

                document.getElementById('applicantNo').innerText = foundUser.id;
                document.getElementById('examineeUser').innerText = foundUser.username;
                document.getElementById('scoreDisplay').innerText = foundUser.score;
                document.getElementById('dateIssued').innerText = foundUser.date;

                const statusBadge = document.getElementById('statusBadge');
                statusBadge.innerText = foundUser.status;
                if (foundUser.status === 'PASSED') {
                    statusBadge.className = 'badge-status badge-passed';
                } else {
                    statusBadge.className = 'badge-status badge-failed';
                }
            } else {
                resultSlip.style.display = 'none';
                emptyState.style.display = 'flex';
                document.getElementById('statusIcon').innerText = '❌';
                document.getElementById('statusTitle').innerText = 'Examinee Not Found';
                document.getElementById('statusDesc').innerText = 'Walang nahanap na record para sa username na ito. Siguraduhing tama ang pagkakainput o makipag-ugnayan sa Office of Admissions.';
            }
        }

        // Admin Portal Modal Logic (Restricted to Authorized Staff Only)
        function openAdminPortal() {
            const staffUsername = prompt("STAFF ACCESS ONLY\n\nEnter Authorized Staff Username:");

            if (staffUsername === null) return; // Khina-cancel ng user

            const formattedInput = staffUsername.trim().toLowerCase();

            // Check kung nasa staff list ang input
            if (authorizedStaff.includes(formattedInput)) {
                renderAdminData();
                document.getElementById('adminModal').style.display = 'flex';
            } else {
                alert("ACCESS DENIED: Ang username na ito ay walang permiso para sa Admin Portal. Para lamang ito sa mga authorized Staff.");
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function renderAdminData() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            let total = examineeDatabase.length;
            let passed = 0;
            let failed = 0;

            examineeDatabase.forEach(user => {
                if (user.status === 'PASSED') passed++;
                if (user.status === 'FAILED') failed++;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.score}</td>
                    <td><span style="color: ${user.status === 'PASSED' ? '#4ade80' : '#f87171'}; font-weight: bold;">${user.status}</span></td>
                    <td>${user.date}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalExaminees').innerText = total;
            document.getElementById('totalPassed').innerText = passed;
            document.getElementById('totalFailed').innerText = failed;
        }

        // Close modal when clicking outside box
        window.onclick = function(event) {
            const modal = document.getElementById('adminModal');
            if (event.target === modal) {
                closeAdminModal();
            }
        }
    </script>
